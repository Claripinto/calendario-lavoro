name: Compila APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - capacitor.config.json
      - package.json
      - assets/**
      - .github/workflows/build-apk.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Chiave di firma (dai Secrets)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Manca il secret DEBUG_KEYSTORE_B64"; exit 1; fi
          echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/firma.keystore"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/firma.keystore" -storepass android | grep SHA256
      - name: Dipendenze
        run: npm install
      - name: Progetto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1d5a86' --splashBackgroundColor '#f3f5f7'
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          # firma sempre con la stessa chiave (quella dei Secrets), non con una chiave generata a caso
          sed -i "0,/^android {/s//android {\n    signingConfigs { debug { storeFile file('$GITHUB_WORKSPACE\/firma.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }/" android/app/build.gradle
          grep -n -A1 'signingConfigs' android/app/build.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Compila
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../CalendarioLavoro.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          { echo "--- verifica"; $BT/apksigner verify --print-certs ../CalendarioLavoro.apk | grep -E 'SHA-256|DN'; $BT/aapt dump badging ../CalendarioLavoro.apk | grep -E "^package|sdkVersion|targetSdk"; } > ../verifica.txt 2>&1 || true
          cat ../verifica.txt
      - name: Pubblica nella pagina Release (link diretto, senza zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          { echo "Installa questo file sul telefono. L'app poi si aggiorna da sola. build: ${{ github.run_number }}"; cat verifica.txt; } > note.txt
          gh release create apk CalendarioLavoro.apk --title "Calendario Lavoro (APK)" --notes-file note.txt
