// Firma sempre con la chiave dei Secrets (decodificata in firma.keystore dalla procedura)
android {
    signingConfigs {
        debug {
            storeFile file(System.getenv("GITHUB_WORKSPACE") + "/firma.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}
